# Alembic configuration for ACT.
#
# The database URL is NOT set here. alembic/env.py reads it from ACT's settings
# (env var DATABASE_URL, else the local SQLite file), so migrations always run
# against the same database the app uses.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Timestamped, slug-suffixed revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
