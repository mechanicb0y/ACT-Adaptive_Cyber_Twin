# Prometheus scrape config for ACT. Used by monitoring/docker-compose.monitoring.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: act
    metrics_path: /api/metrics
    static_configs:
      - targets: ["act-backend:8000"]
    # If ACT_METRICS_TOKEN is set, uncomment and match it:
    # params:
    #   token: ["CHANGE_ME"]
    # or:
    # authorization:
    #   type: Bearer
    #   credentials: "CHANGE_ME"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
