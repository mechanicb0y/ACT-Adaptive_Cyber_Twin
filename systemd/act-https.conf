# Drop-in to serve ACT directly over HTTPS (no reverse proxy).
#
#   mkdir -p /etc/systemd/system/act.service.d
#   cp systemd/act-https.conf /etc/systemd/system/act.service.d/https.conf
#   systemctl daemon-reload && systemctl restart act
#
# With Let's Encrypt (see scripts/letsencrypt.sh) the cert lives at
# /etc/letsencrypt/live/<domain>/. Give the `act` user read access to it, or
# copy the pair somewhere it can read and point the vars there.

[Service]
Environment=ACT_SSL_ENABLED=true
Environment=ACT_SSL_CERT=/etc/letsencrypt/live/act.example.com/fullchain.pem
Environment=ACT_SSL_KEY=/etc/letsencrypt/live/act.example.com/privkey.pem
Environment=ACT_FORCE_HTTPS=true
Environment=ACT_PORT=443
# binding 443 as a non-root user:
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
