<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACT — Adaptive Cyber Twin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060a12;
            --panel: rgba(14, 21, 33, .6);
            --panel-solid: #0c121e;
            --panel2: rgba(21, 29, 44, .88);
            --border: rgba(112, 150, 191, .14);
            --border2: rgba(112, 150, 191, .32);
            --text: #e9f1f8;
            --muted: #8497ac;
            --faint: #51637a;
            --accent: #29e0ff;
            --accent2: #8d7bff;
            --crit: #ff4165;
            --high: #ff9d47;
            --med: #ffcf4d;
            --low: #38e6a0;
            --font-display: 'Chakra Petch', 'Segoe UI', sans-serif;
            --font-body: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, "Cascadia Mono", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--bg);
        }

        body {
            color: var(--text);
            font: 13px/1.55 var(--font-body);
            padding: 18px 22px 44px;
            min-height: 100vh;
        }

        ::selection {
            background: rgba(41, 224, 255, .32);
            color: #fff;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border2) transparent;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        /* live background — a dedicated base layer avoids the browser quirk where
           body's own background-color is promoted to the page canvas and painted
           beneath every negative z-index element, including these. */
        #bgbase {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: var(--bg);
        }

        #bgwash {
            position: fixed;
            inset: -12%;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(720px 580px at 18% 22%, rgba(41, 224, 255, .22), transparent 68%),
                radial-gradient(760px 620px at 84% 78%, rgba(141, 123, 255, .2), transparent 68%);
            filter: blur(50px);
            animation: wash 22s ease-in-out infinite alternate;
        }

        @keyframes wash {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(4%, -3%) scale(1.08);
            }

            100% {
                transform: translate(-3%, 4%) scale(1);
            }
        }

        #bgfx {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: block;
        }

        /* top bar */
        .top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            background: linear-gradient(100deg, var(--text) 35%, var(--accent) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand span {
            color: var(--muted);
            font-family: var(--font-body);
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
        }

        .pulse-mark {
            position: relative;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            flex-shrink: 0;
        }

        .pulse-mark::before,
        .pulse-mark::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0;
            animation: radarping 2.6s ease-out infinite;
        }

        .pulse-mark::after {
            animation-delay: 1.3s;
        }

        @keyframes radarping {
            0% {
                transform: scale(.4);
                opacity: .6;
            }

            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        .grow {
            flex: 1;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
            font-family: var(--font-mono);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--faint);
            transition: .2s;
        }

        .dot.on {
            background: var(--low);
            box-shadow: 0 0 8px var(--low);
        }

        .dot.live {
            background: var(--crit);
            box-shadow: 0 0 8px var(--crit);
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .35
            }
        }

        /* toolbar */
        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 16px;
            box-shadow: 0 12px 30px -22px rgba(0, 0, 0, .7);
        }

        .bar .sep {
            width: 1px;
            height: 22px;
            background: var(--border2);
            margin: 0 4px;
        }

        .bar label {
            font-size: 11px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .6px;
            font-family: var(--font-mono);
        }

        input,
        select,
        button {
            font: inherit;
            color: var(--text);
            background: var(--panel2);
            border: 1px solid var(--border2);
            border-radius: 7px;
            padding: 7px 11px;
        }

        input::placeholder {
            color: var(--faint);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(41, 224, 255, .12);
        }

        button {
            cursor: pointer;
            transition: border-color .15s, color .15s, box-shadow .15s, filter .15s;
        }

        button:hover {
            border-color: var(--accent);
            color: #fff;
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-color: transparent;
            color: #04121a;
            font-weight: 600;
        }

        button.primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 18px rgba(41, 224, 255, .35);
        }

        button.live.on {
            background: var(--crit);
            border-color: var(--crit);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 16px rgba(255, 65, 101, .45);
        }

        button.ghost {
            background: transparent;
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        #ip {
            width: 190px;
        }

        /* kpis */
        .kpis {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .kpi {
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 15px;
            box-shadow: 0 12px 30px -22px rgba(0, 0, 0, .7);
        }

        .kpi .k {
            font-size: 10.5px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .7px;
            font-family: var(--font-mono);
        }

        .kpi .v {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            margin-top: 6px;
            line-height: 1;
        }

        .kpi .s {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
        }

        @media (max-width: 1150px) {
            .kpis {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 1050px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 12px 30px -22px rgba(0, 0, 0, .7);
        }

        .rail .box {
            margin-bottom: 14px;
            padding: 14px;
        }

        .rail h3 {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 11px;
            padding-left: 9px;
            border-left: 2px solid var(--accent);
        }

        /* tabs */
        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 14px;
        }

        .tab {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            padding: 8px 15px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .tab.active {
            background: var(--panel2);
            color: var(--text);
            border-color: var(--accent);
            box-shadow: 0 0 14px -4px rgba(41, 224, 255, .4);
        }

        .tab .n {
            color: var(--faint);
            margin-left: 6px;
        }

        .tab.active .n {
            color: var(--accent);
        }

        /* behavior cards */
        .card {
            background: var(--panel);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 11px;
            position: relative;
            overflow: hidden;
            transition: border-color .2s, transform .2s, box-shadow .2s;
        }

        .card:hover {
            border-color: var(--border2);
            transform: translateY(-1px);
            box-shadow: 0 16px 34px -22px rgba(0, 0, 0, .8);
        }

        .card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--faint);
        }

        .card.Critical::before {
            background: var(--crit);
            box-shadow: 0 0 12px var(--crit);
        }

        .card.High::before {
            background: var(--high);
            box-shadow: 0 0 12px var(--high);
        }

        .card.Medium::before {
            background: var(--med);
            box-shadow: 0 0 10px var(--med);
        }

        .card.Low::before {
            background: var(--low);
            box-shadow: 0 0 10px var(--low);
        }

        .card .row1 {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card .name {
            font-size: 14.5px;
            font-weight: 600;
        }

        .card .desc {
            color: var(--muted);
            font-size: 12.5px;
            margin-top: 2px;
        }

        .card .meta {
            color: var(--faint);
            font-size: 11.5px;
            margin-top: 7px;
        }

        .score {
            text-align: right;
            flex-shrink: 0;
        }

        .score .n {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
        }

        .score .l {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-top: 2px;
        }

        .Critical .n,
        .Critical .l {
            color: var(--crit);
        }

        .High .n,
        .High .l {
            color: var(--high);
        }

        .Medium .n,
        .Medium .l {
            color: var(--med);
        }

        .Low .n,
        .Low .l {
            color: var(--low);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .chip {
            font-size: 11px;
            font-family: var(--font-mono);
            border-radius: 6px;
            padding: 2px 8px;
            border: 1px solid var(--border2);
            color: var(--accent);
            background: rgba(41, 224, 255, .08);
        }

        .chip.tag {
            color: var(--muted);
            background: transparent;
            font-family: var(--font-body);
        }

        /* attack path */
        .pathhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .pathhead .who {
            font-size: 15px;
            font-weight: 700;
        }

        .pathhead .comp {
            text-align: right;
        }

        .pathhead .comp .p {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
        }

        .pathhead .comp .t {
            font-size: 11px;
            color: var(--muted);
        }

        .progress {
            height: 5px;
            background: var(--panel2);
        }

        .progress>i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--med), var(--crit));
        }

        .steps {
            padding: 14px 16px;
        }

        .step {
            display: grid;
            grid-template-columns: 30px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 5px 0;
        }

        .step .num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            background: var(--panel2);
            border: 1px solid var(--border2);
        }

        .step .stage {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .step .lbl {
            font-weight: 600;
            font-size: 13px;
        }

        .step .tech {
            font-size: 11px;
        }

        .connector {
            grid-column: 1;
            width: 26px;
            display: flex;
            justify-content: center;
            height: 16px;
        }

        .connector::before {
            content: "";
            display: block;
            width: 2px;
            height: 100%;
            background: var(--border2);
        }

        /* table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 500;
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--panel-solid);
        }

        td {
            padding: 7px 14px;
            border-bottom: 1px solid rgba(112, 150, 191, .1);
            font-size: 12px;
        }

        tr:last-child td {
            border: none;
        }

        tr:hover td {
            background: rgba(41, 224, 255, .04);
        }

        .tag-type {
            font-size: 10.5px;
            font-family: var(--font-mono);
            padding: 1px 7px;
            border-radius: 5px;
            background: var(--panel2);
            border: 1px solid var(--border2);
            color: var(--muted);
        }

        /* feed + lists */
        .feed {
            max-height: 340px;
            overflow-y: auto;
        }

        .feed .ev {
            padding: 6px 0;
            border-bottom: 1px solid rgba(112, 150, 191, .1);
            font-size: 11.5px;
        }

        .feed .ev:last-child {
            border: none;
        }

        .feed .ev .t {
            color: var(--accent);
        }

        .feed .ev .d {
            color: var(--muted);
        }

        .feed {
            max-height: 300px;
        }

        .feed .ev.fresh {
            animation: flash 1.6s ease-out;
            box-shadow: inset 2px 0 0 var(--accent);
        }

        @keyframes flash {
            0% {
                background: rgba(41, 224, 255, .22);
            }

            100% {
                background: transparent;
            }
        }

        /* Live Feed panel header: title + "new" counter + View all */
        .feedhead {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 11px;
        }

        .feedhead h3 {
            margin: 0;
            border-left: 2px solid var(--accent);
        }

        .feedhead .grow {
            flex: 1;
        }

        .newpill {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            color: #04121a;
            background: var(--accent);
            border-radius: 10px;
            padding: 1px 7px;
            opacity: 0;
            transition: opacity .25s;
        }

        .newpill.show {
            opacity: 1;
            animation: newpulse 1.2s ease-out 2;
        }

        @keyframes newpulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(41, 224, 255, .5);
            }

            50% {
                box-shadow: 0 0 0 5px rgba(41, 224, 255, 0);
            }
        }

        .viewall {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 4px;
        }

        .viewall:hover {
            color: var(--accent);
        }

        /* SIEM-style scrolling log viewer for the Events tab */
        .logview {
            max-height: 62vh;
            overflow: auto;
        }

        .logview table {
            border-collapse: separate;
            border-spacing: 0;
        }

        .logview tbody tr:nth-child(even) td {
            background: rgba(112, 150, 191, .045);
        }

        .logview tbody tr:hover td {
            background: rgba(41, 224, 255, .07);
        }

        .logfoot {
            padding: 8px 14px;
            color: var(--faint);
            font-size: 11px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .listrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(112, 150, 191, .1);
            font-size: 12px;
        }

        .listrow:last-child {
            border: none;
        }

        .pill {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 10px;
        }

        .empty {
            color: var(--faint);
            text-align: center;
            padding: 34px 10px;
            font-size: 12.5px;
        }

        details summary {
            cursor: pointer;
            color: var(--muted);
            font-size: 11.5px;
            margin-top: 9px;
            list-style: none;
        }

        details summary::-webkit-details-marker {
            display: none;
        }

        details summary:hover {
            color: var(--accent);
        }

        .factors {
            margin-top: 8px;
            display: grid;
            gap: 3px;
        }

        .factors div {
            font-size: 11.5px;
            color: var(--muted);
        }

        .factors .pts {
            font-family: var(--font-mono);
            color: var(--high);
            font-weight: 600;
            display: inline-block;
            min-width: 34px;
        }

        .evlist {
            margin-top: 8px;
            font-size: 11px;
            color: var(--muted);
            max-height: 190px;
            overflow-y: auto;
        }

        .evlist div {
            padding: 2px 0;
        }

        @media (prefers-reduced-motion: reduce) {

            .dot.live,
            .pulse-mark::before,
            .pulse-mark::after,
            #bgwash {
                animation: none;
            }

            .card,
            button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div id="bgbase"></div>
    <div id="bgwash"></div>
    <canvas id="bgfx"></canvas>

    <div class="top">
        <div class="brand"><span class="pulse-mark"></span>ACT <span>· Adaptive Cyber Twin</span></div>
        <div class="grow"></div>
        <div class="status"><span class="dot" id="liveDot"></span><span id="liveTxt">idle</span></div>
        <div class="status"><span class="dot" id="wsDot"></span><span>stream</span></div>
        <a href="/docs" target="_blank" style="font-size:12px">API</a>
        <span id="whoami" class="mono" style="font-size:11px;color:var(--muted)" hidden></span>
        <a href="#" id="logout" style="font-size:12px" hidden onclick="signOut();return false">sign out</a>
    </div>

    <div class="bar">
        <label>Kali VM</label>
        <input id="ip" class="mono" placeholder="kali@192.168.10.139" spellcheck="false">
        <button id="liveBtn" class="live" onclick="toggleLive()">Go live</button>
        <button onclick="pull()">Pull 1h</button>
        <div class="sep"></div>
        <select id="logSel"></select>
        <button class="ghost" onclick="replay()">Replay</button>
        <div class="sep"></div>
        <button class="ghost" onclick="clearAll()">Clear</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div id="twin" style="margin-bottom:16px"></div>

    <div class="grid">
        <div>
            <div class="tabs">
                <button class="tab active" data-t="behaviors" onclick="tab('behaviors')">Behaviors <span class="n"
                        id="cBeh">0</span></button>

    <script>
        /* live cyberspace backdrop — a sparse network mesh with traveling signal
           pulses, echoing the attack-graph propagation the dashboard itself renders */
        (function () {
            const canvas = document.getElementById("bgfx");
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext("2d");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            let w, h, dpr, nodes = [], edges = [], packets = [];

            function build() {
                nodes = []; edges = [];
                const cell = 150;
                const cols = Math.ceil(w / cell), rows = Math.ceil(h / cell);
                for (let y = 0; y <= rows; y++) {
                    for (let x = 0; x <= cols; x++) {
                        if (Math.random() < 0.2) continue;
                        nodes.push({
                            x: x * cell + (Math.random() - 0.5) * cell * 0.7,
                            y: y * cell + (Math.random() - 0.5) * cell * 0.7
                        });
                    }
                }
                const seen = new Set();
                for (let i = 0; i < nodes.length; i++) {
                    const near = [];
                    for (let j = 0; j < nodes.length; j++) {
                        if (i === j) continue;
                        const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
                        if (d < cell * 1.6) near.push([d, j]);
                    }
                    near.sort((a, b) => a[0] - b[0]);
                    near.slice(0, 2).forEach(([, j]) => {
                        const key = i < j ? i + "-" + j : j + "-" + i;
                        if (seen.has(key)) return;
                        seen.add(key);
                        edges.push({ a: i, b: j });
                    });
                }
                packets = [];
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth; h = window.innerHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                canvas.style.width = w + "px"; canvas.style.height = h + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                build();
            }

            function spawnPacket() {
                if (!edges.length || packets.length > 34) return;
                const e = edges[(Math.random() * edges.length) | 0];
                packets.push({
                    a: nodes[e.a], b: nodes[e.b], t: 0,
                    speed: 0.003 + Math.random() * 0.006,
                    color: Math.random() < 0.6 ? "41,224,255" : "141,123,255"
                });
            }

            function frame() {
                if (!reduceMotion) requestAnimationFrame(frame);
                ctx.clearRect(0, 0, w, h);

                ctx.lineWidth = 1.1;
                ctx.strokeStyle = "rgba(140,185,225,0.3)";
                ctx.beginPath();
                edges.forEach(e => {
                    const a = nodes[e.a], b = nodes[e.b];
                    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                });
                ctx.stroke();

                ctx.fillStyle = "rgba(180,212,235,0.9)";
                nodes.forEach(n => {
                    ctx.beginPath(); ctx.arc(n.x, n.y, 1.7, 0, Math.PI * 2); ctx.fill();
                });

                if (!reduceMotion && Math.random() < 0.12) spawnPacket();

                packets.forEach(p => {
                    p.t += p.speed;
                    const x = p.a.x + (p.b.x - p.a.x) * p.t;
                    const y = p.a.y + (p.b.y - p.a.y) * p.t;
                    const alpha = Math.sin(Math.min(p.t, 1) * Math.PI);
                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = `rgba(${p.color},1)`;
                    ctx.fillStyle = `rgba(${p.color},${alpha})`;
                    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                });
                packets = packets.filter(p => p.t < 1);
            }

            window.addEventListener("resize", resize);
            resize();
            frame();
        })();
    </script>

    <script>
        const API = location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
        let liveOn = false, wsIndex = 0;

        const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const pct = n => Math.round((n || 0) * 100) + "%";
        const hhmmss = s => (String(s || "").split(" ")[1] || "");
        const rc = n => n >= 80 ? "var(--crit)" : n >= 60 ? "var(--high)" : n >= 35 ? "var(--med)" : "var(--low)";
        const sevColor = { Critical: "var(--crit)", High: "var(--high)", Medium: "var(--med)", Low: "var(--low)" };

        /* ---- auth: bearer token kept in localStorage, refreshed on demand ---- */
        const auth = {
            access: () => localStorage.getItem("act_access") || "",
            refresh: () => localStorage.getItem("act_refresh") || "",
            expires: () => Number(localStorage.getItem("act_expires") || 0),
            clear: () => ["act_access", "act_refresh", "act_expires", "act_role", "act_user"]
                .forEach(k => localStorage.removeItem(k)),
        };

        function toLogin() {
            auth.clear();
            location.replace("/login?next=" + encodeURIComponent(location.pathname));
        }

        function signOut() {
            const rt = auth.refresh();
            if (rt) navigator.sendBeacon
                ? fetch(API + "/api/auth/logout", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ refresh_token: rt }), keepalive: true,
                }).catch(() => { })
                : null;
            toLogin();
        }

        let _refreshing = null;
        async function ensureFreshToken() {
            if (!auth.access()) return;
            if (auth.expires() - Date.now() > 60_000) return;   // still good
            if (!auth.refresh()) return;
            if (!_refreshing) {
                _refreshing = fetch(API + "/api/auth/refresh", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ refresh_token: auth.refresh() }),
                }).then(async r => {
                    if (!r.ok) throw new Error("refresh failed");
                    const d = await r.json();
                    localStorage.setItem("act_access", d.access_token);
                    localStorage.setItem("act_refresh", d.refresh_token);
                    localStorage.setItem("act_expires", String(Date.now() + (d.expires_in || 1800) * 1000));
                    if (d.role) localStorage.setItem("act_role", d.role);
                }).catch(() => toLogin()).finally(() => { _refreshing = null; });
            }
            await _refreshing;
        }

        async function api(path, opts) {
            opts = opts || {};
            await ensureFreshToken();
            const tok = auth.access();
            if (tok) opts.headers = Object.assign({}, opts.headers, { Authorization: "Bearer " + tok });
            const r = await fetch(API + path, opts);
            if (r.status === 401) { toLogin(); throw new Error("session expired"); }
            if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch (e) { } throw new Error(d); }
            return r.status === 204 ? null : r.json();
        }

        async function initAuth() {
            try {
                const me = await api("/api/auth/me");
                const w = document.getElementById("whoami"), lo = document.getElementById("logout");
                const prototype = me.username === "prototype";   // ACT_AUTH_ENABLED=false
                if (w) { w.textContent = me.username + " · " + me.role; w.hidden = false; }
                if (lo) lo.hidden = prototype;
            } catch (e) { /* api() already redirected on 401 */ }
        }
        initAuth();

        /* incident reports (per attacker) — fetched with the bearer token, then
           handed to the browser as a blob so no token rides in a URL */
        const reportUrl = (actor, fmt) => API + "/api/report/" + encodeURIComponent(actor) + "?format=" + fmt;
        async function fetchReportBlob(actor, fmt) {
            await ensureFreshToken();
            const tok = auth.access();
            const r = await fetch(reportUrl(actor, fmt), tok ? { headers: { Authorization: "Bearer " + tok } } : undefined);
            if (r.status === 401) { toLogin(); throw new Error("session expired"); }
            if (!r.ok) throw new Error("report failed (" + r.status + ")");
            return r.blob();
        }
        async function openReport(actor) {
            if (!actor) return flash("no attacker to report on");
            try {
                const url = URL.createObjectURL(await fetchReportBlob(actor, "html"));
                window.open(url, "_blank");
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            } catch (e) { flash(e.message); }
        }
        async function downloadReport(actor) {
            if (!actor) return flash("no attacker to report on");
            flash("building PDF for " + actor + "…");
            try {
                const url = URL.createObjectURL(await fetchReportBlob(actor, "pdf"));
                const a = document.createElement("a");
                a.href = url; a.download = "act-report-" + actor + ".pdf";
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            } catch (e) { flash(e.message); }
        }
        // buttons carry the actor in a data-attribute (esc() is sufficient for a
        // quoted HTML attribute); a single delegated listener does the work, so
        // no attacker-influenced value is ever interpolated into a JS string.
        const reportBtns = actor => `
            <button class="ghost rbtn" data-fmt="html" data-actor="${esc(actor)}" style="font-size:11px;padding:4px 10px">Export Report</button>
            <button class="ghost rbtn" data-fmt="pdf" data-actor="${esc(actor)}" style="font-size:11px;padding:4px 10px">PDF</button>`;
        document.addEventListener("click", ev => {
            const btn = ev.target.closest(".rbtn");
            if (!btn) return;
            (btn.dataset.fmt === "pdf" ? downloadReport : openReport)(btn.dataset.actor);
        });

        function target() {
            const raw = document.getElementById("ip").value.trim();
            if (!raw) return null;
            localStorage.setItem("act_ip", raw);
            const [user, host] = raw.includes("@") ? raw.split("@") : ["kali", raw];
            return "host=" + encodeURIComponent(host) + "&user=" + encodeURIComponent(user);
        }

        function tab(name) {
            document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === name));
            ["behaviors", "graph", "events"].forEach(id => document.getElementById(id).hidden = id !== name);
            if (name === "events") loadEvents();
        }

        /* actions */
        async function pull() {
            const t = target(); if (!t) return flash("Enter the VM address");
            try {
                const s = await api("/api/ingest/ssh?" + t + "&since=-1h", { method: "POST" });
                flash(`${s.events_created} events from the VM`); refresh();
            }
            catch (e) { flash(e.message); }
        }
        async function replay() {
            const name = document.getElementById("logSel").value;
            if (!name) { flash("Pick a sample log from the dropdown first"); return; }
            flash("replaying " + name + "…");
            try {
                const s = await api("/api/ingest/file?path=" + encodeURIComponent(name), { method: "POST" });
                flash((s.events_created ?? 0) + " events from " + name);
                refresh();
            }
            catch (e) { flash("replay failed: " + e.message); }
        }
        async function toggleLive() {
            try {
                if (liveOn) { await api("/api/live/stop", { method: "POST" }); }
                else {
                    const t = target(); if (!t) return flash("Enter the VM address");
                    const r = await api("/api/live/start?" + t + "&since=-5m", { method: "POST" });
                    if (r.error) return flash(r.error);
                }
                refresh();
            } catch (e) { flash(e.message); }
        }
        async function clearAll() {
            flash("clearing…");
            try {
                await api("/api/reset", { method: "POST" });
                RESP_SEEN = {}; _feedTopId = null; _feedEvents = [];
                closeFeedModal();
                document.getElementById("feedNew").classList.remove("show");
                document.getElementById("feed").innerHTML = '<div class="empty">—</div>';
                document.getElementById("twin").innerHTML = "";
                flash("cleared");
                refresh();
            } catch (e) { flash("clear failed: " + e.message); }
        }
        function flash(msg) {
            const el = document.getElementById("liveTxt");
            const prev = el.textContent; el.textContent = msg;
            setTimeout(() => { if (el.textContent === msg) el.textContent = liveOn ? "live" : "idle"; }, 2600);
        }

        /* render */
        async function refresh() {
            let s;
            try { s = await api("/api/stats"); }
            catch (e) {
                document.getElementById("kpis").innerHTML =
                `<div class="kpi"><div class="k">API</div><div class="v" style="font-size:15px">offline</div><div class="s">start uvicorn</div></div>`; return;
            }

            liveOn = s.live.running;
            const lb = document.getElementById("liveBtn");
            lb.textContent = liveOn ? "Stop" : "Go live";
            lb.classList.toggle("on", liveOn);
            document.getElementById("liveDot").className = "dot " + (liveOn ? "live" : (s.events.total ? "on" : ""));
            document.getElementById("liveTxt").textContent = liveOn ? "live" : (s.events.total ? "loaded" : "idle");

            const a = s.attack, b = s.behaviors;
            document.getElementById("kpis").innerHTML = `
        ${kpi("Events", s.events.total, pct(s.ingestion.coverage) + " understood")}
        ${kpi("Behaviors", b.total, (b.by_severity.Critical || 0) + " critical", b.total ? "var(--text)" : "")}
        ${kpi("Highest Risk", b.highest_risk, "of 100", rc(b.highest_risk))}
        ${kpi("Attack Paths", a.paths, a.compromised ? "compromised" : "no compromise", a.compromised ? "var(--crit)" : "")}
        ${kpi("Kill Chain", pct(a.worst_completeness), "stage " + a.deepest_stage + " of " + a.total_stages)}
        ${kpi("Techniques", s.techniques.length, "MITRE ATT&CK")}`;

            document.getElementById("cBeh").textContent = b.total;
            document.getElementById("cPath").textContent = a.paths;
            document.getElementById("cEv").textContent = s.events.total;

            document.getElementById("sources").innerHTML = s.top_attackers.length
                ? s.top_attackers.map(x => `<div class="listrow"><span class="mono">${esc(x.ip_address)}</span>
            <span><span style="color:var(--faint)">${x.events}ev</span>
            <span class="pill" style="color:${rc(x.highest_risk)}">${x.highest_risk}</span></span></div>`).join("")
                : '<div class="empty">—</div>';

            document.getElementById("techs").innerHTML = s.techniques.length
                ? s.techniques.map(t => `<div class="listrow"><a href="${esc(t.url)}" target="_blank" class="mono">${esc(t.id)}</a>
            <span style="color:var(--faint)">${esc(t.tactic)}</span></div>`).join("")
                : '<div class="empty">—</div>';

            loadBehaviors(); loadGraph(); loadTwin(); loadAlerts(); loadFeed();
            if (!document.getElementById("events").hidden) loadEvents();
        }

        /* Live Feed: the last 10 events, newest first. Rendered on every refresh
           (and every websocket push) so it always reflects reality, whether
           events arrived live or from a replay / one-shot pull. New rows flash
           in and a "+N new" pill appears briefly. "View all" opens the modal. */
        const FEED_ROWS = 10;
        let _feedTopId = null, _feedEvents = [], _feedNewTimer = null;

        const feedRow = (e, fresh) =>
            `<div class="ev${fresh ? " fresh" : ""}">` +
            `<span class="t mono">${esc(hhmmss(e.timestamp))}</span> ` +
            `<span class="tag-type">${esc(e.event_type)}</span> ` +
            `<span class="d">${esc(e.description)}</span></div>`;

        async function loadFeed() {
            const feed = document.getElementById("feed");
            let d;
            try { d = await api("/api/events?limit=300"); } catch (e) { return; }
            _feedEvents = d.events;
            if (!d.events.length) { feed.innerHTML = '<div class="empty">—</div>'; _feedTopId = null; return; }

            // how many events at the top are new since the last render
            const seen = d.events.findIndex(e => e.id === _feedTopId);
            const freshCount = _feedTopId == null ? 0 : (seen < 0 ? d.events.length : seen);
            _feedTopId = d.events[0].id;

            feed.innerHTML = d.events.slice(0, FEED_ROWS)
                .map((e, i) => feedRow(e, i < freshCount)).join("");

            const pill = document.getElementById("feedNew");
            if (freshCount > 0) {
                pill.textContent = "+" + freshCount + " new";
                pill.classList.add("show");
                clearTimeout(_feedNewTimer);
                _feedNewTimer = setTimeout(() => pill.classList.remove("show"), 3200);
            }
            // reflect the new count in the open modal too
            const mBody = document.getElementById("feed-modal-body");
            if (mBody) mBody.innerHTML = _feedEvents.map((e, i) => feedRow(e, i < freshCount)).join("");
        }

        function closeFeedModal() {
            const m = document.getElementById("feed-modal");
            if (m) m.remove();
            document.removeEventListener("keydown", _feedEsc);
        }
        function _feedEsc(e) { if (e.key === "Escape") closeFeedModal(); }

        function openFeedModal() {
            closeFeedModal();
            const back = document.createElement("div");
            back.id = "feed-modal";
            back.style.cssText = "position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;" +
                "padding:24px;background:rgba(6,8,12,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)";
            back.addEventListener("click", ev => { if (ev.target === back) closeFeedModal(); });

            const boxEl = document.createElement("div");
            boxEl.className = "panel";
            boxEl.style.cssText = "max-width:760px;width:100%;max-height:82vh;display:flex;flex-direction:column;padding:16px 18px";
            boxEl.innerHTML =
                `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                   <div style="font-family:var(--font-display);font-weight:700;color:var(--accent)">Live Feed — recent events</div>
                   <span class="grow" style="flex:1"></span>
                   <span class="mono" style="font-size:11px;color:var(--faint)">${_feedEvents.length} shown</span>
                   <button class="ghost" style="padding:2px 9px;font-size:14px;line-height:1" onclick="closeFeedModal()" title="close (Esc)">✕</button>
                 </div>
                 <div class="feed" id="feed-modal-body" style="max-height:none;flex:1;overflow-y:auto">
                   ${_feedEvents.map(e => feedRow(e, false)).join("") || '<div class="empty">—</div>'}
                 </div>`;
            back.appendChild(boxEl);
            document.body.appendChild(back);
            document.addEventListener("keydown", _feedEsc);
        }

        let ARMED = false;       // a live SSH responder is attached to a VM
        let RESP_SEEN = {};      // actor -> last response status we toasted about

        // transient, centred, translucent toast — nothing stays on screen
        function toast(msg, ms = 2200) {
            let el = document.getElementById("toast");
            if (!el) {
                el = document.createElement("div");
                el.id = "toast";
                el.style.cssText = "position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);" +
                    "background:rgba(15,17,22,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);" +
                    "color:#fff;padding:16px 26px;border-radius:14px;font-size:14px;font-weight:600;letter-spacing:.3px;" +
                    "z-index:9999;pointer-events:none;opacity:0;transition:opacity .35s ease;max-width:70vw;text-align:center;" +
                    "border:1px solid rgba(255,255,255,.14)";
                document.body.appendChild(el);
            }
            el.textContent = msg;
            clearTimeout(el._on); clearTimeout(el._off);
            el.style.opacity = "0";
            el._on = setTimeout(() => { el.style.opacity = "1"; }, 10);
            el._off = setTimeout(() => { el.style.opacity = "0"; }, ms);
        }

        async function loadTwin() {
            const box = document.getElementById("twin");
            let d;
            try { d = await api("/api/intelligence"); } catch (e) { box.innerHTML = ""; return; }
            ARMED = !!d.armed;

            if (!d.assessments.length) {
                const msg = d.assessing
                    ? "Analysing the attack — predicting, deciding and writing the assessment…"
                    : "No attacker to assess yet.";
                box.innerHTML = `<div class="panel" style="padding:0;overflow:hidden">
                  ${twinHeader(null, null)}
                  <div style="padding:14px 16px;color:var(--faint);font-size:12px">${esc(msg)}</div>
                </div>`;
                return;
            }

            const a = d.assessments[0];              // worst attacker
            const p = a.prediction, dec = a.decision, r = a.response, ai = a.llm_review;
            const next = p.next_steps[0];

            const ACT_LABEL = { block_ip: "BLOCK IP", lock_account: "LOCK ACCOUNT", isolate_host: "ISOLATE HOST", alert: "ALERT · REVIEW", monitor: "NO ACTION NEEDED" };
            const ACT_COLOR = { block_ip: "var(--crit)", lock_account: "var(--crit)", isolate_host: "var(--crit)", alert: "var(--high)", monitor: "var(--low)" };
            const actLabel = ACT_LABEL[dec.action] || dec.action.replace("_", " ").toUpperCase();
            const actColor = ACT_COLOR[dec.action] || "var(--low)";
            const acts = dec.needs_arming;                 // this action changes the machine
            const alsoConsider = (dec.also_consider || []);

            // respond-outcome: toast once when it changes, and show a compact line
            let outcome = "";
            if (r && acts) {
                const seen = RESP_SEEN[a.actor];
                if (r.status === "executed") {
                    if (seen !== "executed") toast("BLOCKED " + (dec.target || a.actor) + " on " + (d.ssh_target || "the VM"), 3200);
                    outcome = `<div style="font-size:11px;font-weight:700;margin-top:6px;color:var(--crit)">✓ BLOCKED on ${esc(d.ssh_target || "VM")}</div>`;
                } else if (r.status === "pending") {
                    outcome = `<div style="font-size:11px;font-weight:700;margin-top:6px;color:var(--accent)">⟳ blocking on ${esc(d.ssh_target || "the VM")}…</div>
                               <div class="mono" style="font-size:10px;color:var(--faint);margin-top:3px;word-break:break-all">${esc(r.detail || "")}</div>`;
                } else if (r.status === "failed") {
                    if (seen !== "failed") toast("Block failed — see the panel.", 3600);
                    outcome = `<div style="font-size:11px;font-weight:700;margin-top:6px;color:var(--high)">✕ BLOCK FAILED</div>
                               <div class="mono" style="font-size:10px;color:var(--faint);margin-top:3px;word-break:break-all">${esc(r.detail || "")}</div>`;
                } else if (r.status === "dry_run") {
                    outcome = `<div style="font-size:10.5px;margin-top:6px;color:var(--muted)">waiting for a VM — connect over SSH (Pull 1h / Go live) and this runs automatically</div>`;
                } else if (r.status === "blocked") {
                    outcome = `<div style="font-size:11px;font-weight:700;margin-top:6px;color:var(--high)">✕ refused — action not on the responder allow-list</div>`;
                }
                RESP_SEEN[a.actor] = r.status;
            }

            const aiColor = !ai ? "var(--faint)"
                : ai.recommendation === "block" ? "var(--crit)"
                : ai.recommendation === "alert" ? "var(--high)" : "var(--low)";

            box.innerHTML = `<div class="panel" style="padding:0;overflow:hidden">
              ${twinHeader(p, a)}
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)">
                <div style="background:var(--panel-solid);padding:13px 16px">
                  <div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px">Predict · next move</div>
                  <div style="font-size:15px;font-weight:600;margin-top:5px">${next ? esc(next.stage_name) : "—"}</div>
                  <div style="height:5px;background:var(--panel2);border-radius:3px;margin-top:7px;overflow:hidden"><i style="display:block;height:100%;width:${next ? Math.round(next.probability * 100) : 0}%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></i></div>
                  <div class="mono" style="color:var(--muted);font-size:11px;margin-top:5px">${next ? Math.round(next.probability * 100) + "% likely · anomaly " + Math.round(p.anomaly_score * 100) + "%" : ""}</div>
                </div>
                <div style="background:var(--panel-solid);padding:13px 16px">
                  <div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px">Decide · action</div>
                  <div style="font-size:15px;font-weight:700;margin-top:5px;color:${actColor}">${esc(actLabel)}</div>
                  ${dec.action !== "monitor" ? `<div class="mono" style="font-size:13px;margin-top:4px">${esc(dec.target || "")}</div>` : ""}
                  ${ai ? `<div style="font-size:10.5px;margin-top:6px;color:${aiColor}">AI: ${esc(ai.recommendation)}${ai.threat ? " · " + esc(ai.threat) : ""} · ${Math.round((ai.confidence || 0) * 100)}%</div>` : ""}
                  ${alsoConsider.length ? `<div style="color:var(--muted);font-size:10.5px;margin-top:4px;line-height:1.5">also: ${alsoConsider.map(esc).join(" · ")}</div>` : ""}
                </div>
                <div style="background:var(--panel-solid);padding:13px 16px">
                  <div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px">Respond</div>
                  <div class="mono" style="font-size:20px;font-weight:800;margin-top:5px;color:${acts ? 'var(--crit)' : 'var(--faint)'}">${esc(acts ? (dec.target || "—") : "—")}</div>
                  ${outcome}
                </div>
              </div>
              <div style="padding:12px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;line-height:1.6">${esc(a.narrative)}</div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--border)">
                ${(() => {
                    const aiDec = dec.ai_assessment;
                    if (aiDec && aiDec.influence && aiDec.influence !== "advisory")
                        return `<span class="mono" style="font-size:10.5px;color:var(--accent)">AI influence: ${esc(aiDec.influence)}${aiDec.blended_confidence != null ? " · confidence " + Math.round(aiDec.blended_confidence * 100) + "%" : ""}</span>`;
                    return `<span class="mono" style="font-size:10.5px;color:var(--faint)">${aiDec ? "AI consulted · advisory" : "deterministic decision"}</span>`;
                })()}
                <span class="grow" style="flex:1"></span>
                ${reportBtns(a.actor)}
              </div>
            </div>`;
        }

        function twinHeader(p, a) {
            return `<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)">
                <span style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--accent)">Cognitive Twin</span>
                <span class="grow" style="flex:1"></span>
                <span class="mono" style="font-size:11px;color:${ARMED ? 'var(--crit)' : 'var(--faint)'}">${ARMED ? "● auto-response armed" : "○ no VM connected"}</span>
              </div>`;
        }
        const kpi = (k, v, s, color) => `<div class="kpi"><div class="k">${k}</div>
    <div class="v" style="color:${color || 'var(--text)'}">${v}</div><div class="s">${s}</div></div>`;

        let BEH_BY_ID = {};
        let _behHash = "";

        async function loadBehaviors() {
            const d = await api("/api/behaviors?evidence=5");
            const box = document.getElementById("behaviors");
            if (!d.count) { box.innerHTML = '<div class="panel empty">No behaviors</div>'; _behHash = ""; BEH_BY_ID = {}; return; }

            BEH_BY_ID = {};
            d.behaviors.forEach(b => { BEH_BY_ID[b.id] = b; });

            // only touch the DOM when something actually changed, so the tab
            // does not flicker every poll
            const hash = JSON.stringify(d.behaviors.map(b => [b.id, b.risk_score, b.evidence_count, b.last_seen]));
            if (hash === _behHash) return;
            _behHash = hash;

            box.innerHTML = d.behaviors.map(b => `
        <div class="card ${esc(b.severity)}">
            <div class="row1">
                <div><div class="name">${esc(b.name)}</div><div class="desc">${esc(b.description)}</div></div>
                <div class="score"><div class="n">${b.risk_score}</div><div class="l">${esc(b.severity)}</div></div>
            </div>
            <div class="chips">
                <span class="chip tag">stage ${b.stage} · ${esc(b.stage_name)}</span>
                ${b.techniques.map(t => `<a class="chip" href="${esc(t.url)}" target="_blank" title="${esc(t.name)}">${esc(t.id)}</a>`).join("")}
            </div>
            <div class="meta mono">${esc(b.rule)} · ${b.evidence_count} events · ${esc(hhmmss(b.first_seen))}–${esc(hhmmss(b.last_seen))}</div>
            <button class="ghost" style="margin-top:9px;font-size:11.5px;padding:4px 10px" onclick="showBreakdown('${esc(b.id)}')">score breakdown &amp; evidence</button>
        </div>`).join("");
        }

        /* --- score-breakdown modal: stays open until the user closes it --- */
        function closeBreakdown() {
            const m = document.getElementById("bd-modal");
            if (m) m.remove();
            document.removeEventListener("keydown", _bdEsc);
        }
        function _bdEsc(e) { if (e.key === "Escape") closeBreakdown(); }

        function _bdBody(b) {
            const factors = b.risk_factors.map(f =>
                `<div><span class="pts">${f.points >= 0 ? "+" : ""}${f.points}</span>${esc(f.detail)}</div>`).join("");
            const evs = b.evidence.map(e =>
                `<div>${esc(hhmmss(e.timestamp))} ${esc(e.event_type)} ${esc(e.description || "")}</div>`).join("");
            const more = b.evidence_count > b.evidence.length
                ? `<button class="ghost" style="margin-top:8px;font-size:11px;padding:4px 10px" onclick="expandEvidence('${esc(b.id)}')">+${b.evidence_count - b.evidence.length} more events</button>`
                : "";
            return `
                <div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px">score breakdown</div>
                <div class="factors">${factors}</div>
                <div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-top:14px">evidence · ${b.evidence.length} of ${b.evidence_count}</div>
                <div class="evlist mono" style="max-height:46vh">${evs}</div>
                ${more}`;
        }

        function showBreakdown(id) {
            const b = BEH_BY_ID[id];
            if (!b) return;
            closeBreakdown();

            const back = document.createElement("div");
            back.id = "bd-modal";
            back.style.cssText = "position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;" +
                "padding:24px;background:rgba(6,8,12,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)";
            back.addEventListener("click", ev => { if (ev.target === back) closeBreakdown(); });

            const boxEl = document.createElement("div");
            boxEl.className = "panel";
            boxEl.style.cssText = "max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:16px 18px;position:relative";
            boxEl.innerHTML = `
                <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:6px">
                  <div style="flex:1">
                    <div style="font-family:var(--font-display);font-weight:700;color:var(--accent)">${esc(b.name)}</div>
                    <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(b.description)}</div>
                  </div>
                  <div style="font-weight:800;font-size:20px;color:${rc(b.risk_score)}">${b.risk_score}</div>
                  <button class="ghost" style="padding:2px 9px;font-size:14px;line-height:1" onclick="closeBreakdown()" title="close (Esc)">✕</button>
                </div>
                <div id="bd-content">${_bdBody(b)}</div>`;

            back.appendChild(boxEl);
            document.body.appendChild(back);
            document.addEventListener("keydown", _bdEsc);
        }

        async function expandEvidence(id) {
            try {
                const full = await api("/api/behaviors/" + encodeURIComponent(id));
                BEH_BY_ID[id] = full;
                const c = document.getElementById("bd-content");
                if (c) c.innerHTML = _bdBody(full);
            } catch (e) { flash(e.message); }
        }

        async function loadGraph() {
            const d = await api("/api/attack-graph");
            const box = document.getElementById("graph");
            if (!d.path_count) { box.innerHTML = '<div class="panel empty">No attack paths</div>'; return; }
            box.innerHTML = d.paths.map(p => {
                const inc = {}; p.edges.forEach(e => { inc[e.target] = (inc[e.target] || []).concat(e.reasons); });
                const steps = p.nodes.map((n, i) => {
                    const link = i === 0 ? "" : `<div class="connector"></div>`;
                    return link + `<div class="step">
                <div class="num" style="color:${rc(n.risk_score)};border-color:${rc(n.risk_score)}">${n.stage}</div>
                <div><div class="stage">${esc(n.stage_name)}</div><div class="lbl">${esc(n.label)}</div></div>
                <div style="text-align:right"><div class="tech">${n.techniques.map(t => `<a href="${esc(t.url)}" target="_blank" class="mono">${esc(t.id)}</a>`).join(" ")}</div>
                <div style="font-weight:700;color:${rc(n.risk_score)}">${n.risk_score}</div></div>
            </div>`;
                }).join("");
                return `<div class="panel" style="margin-bottom:14px">
            <div class="pathhead">
                <div><div class="who mono">${esc(p.actor || "unknown")}</div>
                    <div style="color:var(--faint);font-size:11.5px" class="mono">${esc(hhmmss(p.started_at))}–${esc(hhmmss(p.ended_at))}</div></div>
                <div class="comp"><div class="p" style="color:${p.succeeded ? "var(--crit)" : "var(--med)"}">${pct(p.completeness)}</div>
                    <div class="t">stage ${p.deepest_stage}/${p.total_stages} · ${p.succeeded ? "compromised" : "no compromise"}</div>
                    ${p.actor ? `<div style="margin-top:6px">${reportBtns(p.actor)}</div>` : ""}</div>
            </div>
            <div class="progress"><i style="width:${pct(p.completeness)}"></i></div>
            <div class="steps">${steps}</div>
        </div>`;
            }).join("");
        }

        async function loadEvents() {
            const d = await api("/api/events?limit=500");
            const box = document.getElementById("events");
            if (!d.total) { box.innerHTML = '<div class="panel empty">No events</div>'; return; }
            box.innerHTML = `<div class="panel" style="overflow:hidden">
        <div class="logview">
        <table><thead><tr><th>Time</th><th>Type</th><th>User</th><th>Source</th><th>Description</th></tr></thead><tbody>${d.events.map(e => `<tr>
            <td class="mono" style="color:var(--muted);white-space:nowrap">${esc(e.timestamp)}</td>
            <td><span class="tag-type">${esc(e.event_type)}</span></td>
            <td class="mono">${esc(e.user || "")}</td>
            <td class="mono">${esc(e.ip_address || "")}</td>
            <td style="color:var(--muted)">${esc(e.description)}</td></tr>`).join("")}</tbody></table>
        </div>
        <div class="logfoot"><span>Showing ${d.count} of ${d.total} events</span></div></div>`;
        }

        /* coalesce a flood of websocket events into at most one refresh / 1.5s */
        let _refreshTimer = null, _lastRefresh = 0;
        function refreshSoon() {
            if (_refreshTimer) return;
            const wait = Math.max(0, 1500 - (Date.now() - _lastRefresh));
            _refreshTimer = setTimeout(() => {
                _refreshTimer = null; _lastRefresh = Date.now(); refresh();
            }, wait);
        }

        /* live stream */
        function stream() {
            const base = API || location.origin;
            const qs = auth.access() ? "?token=" + encodeURIComponent(auth.access()) : "";
            let ws; try { ws = new WebSocket(base.replace(/^http/, "ws") + "/api/stream" + qs); }
            catch (e) { return setTimeout(stream, 4000); }
            ws.onopen = () => document.getElementById("wsDot").classList.add("on");
            ws.onmessage = ev => {
                let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
                if (m.type === "events") refreshSoon();   // loadFeed() re-renders from /api/events
            };
            ws.onclose = () => { document.getElementById("wsDot").classList.remove("on"); setTimeout(stream, 4000); };
        }

        /* critical-alert (Telegram) status + controls */
        async function loadAlerts() {
            const box = document.getElementById("alerts");
            let s;
            try { s = await api("/api/notifications"); } catch (e) { box.innerHTML = '<div class="empty">—</div>'; return; }

            const stateColor = s.enabled ? (s.configured ? "var(--low)" : "var(--high)") : "var(--faint)";
            const stateTxt = !s.enabled ? "disabled"
                : s.configured ? "armed"
                : "on — add a Telegram bot token";

            box.innerHTML = `
              <div class="listrow"><span>Status</span>
                <span class="pill" style="color:${stateColor}">${esc(stateTxt)}</span></div>
              <div class="listrow"><span>Fire at risk ≥</span><span class="mono">${s.risk_threshold}</span></div>
              <div class="listrow"><span>Telegram bot</span><span class="mono" style="color:${s.telegram_ready ? 'var(--low)' : 'var(--faint)'}">${s.telegram_ready ? "ready" : "not set"}</span></div>
              <div class="listrow"><span>Alerts sent</span><span class="mono">${s.alerts_sent}</span></div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
                <button class="ghost" style="font-size:11px;padding:4px 9px" onclick="setAlerts(${!s.enabled})">${s.enabled ? "Disable" : "Enable"}</button>
                <button class="ghost" style="font-size:11px;padding:4px 9px" onclick="testAlerts()">Send test</button>
              </div>
              ${s.last_error ? `<div class="mono" style="font-size:10px;color:var(--high);margin-top:6px;word-break:break-all">${esc(s.last_error)}</div>` : ""}`;
        }
        async function setAlerts(enable) {
            try {
                await api("/api/notifications/config?enabled=" + enable, { method: "POST" });
                flash("alerts " + (enable ? "enabled" : "disabled"));
                loadAlerts();
            } catch (e) { flash(e.message); }
        }
        async function testAlerts() {
            flash("sending test alert…");
            try {
                const r = await api("/api/notifications/test", { method: "POST" });
                const ok = (r.results || []).some(x => x.ok);
                const err = ((r.results || []).find(x => !x.ok) || {}).error;
                toast(ok ? "test alert sent via Telegram" : ("test failed" + (err ? " — " + err : "")), 3200);
                loadAlerts();
            } catch (e) { toast(e.message, 3600); }
        }

        async function loadLogs() {
            try {
                const d = await api("/api/logs");
                document.getElementById("logSel").innerHTML =
                    '<option value="">sample log…</option>' + d.logs.map(l => `<option value="${esc(l.name)}">${esc(l.name)}</option>`).join("");
            } catch (e) { }
        }

        document.getElementById("ip").value = localStorage.getItem("act_ip") || "";
        loadLogs(); refresh(); stream();
        setInterval(refresh, 8000);
    </script>
</body>

</html>
