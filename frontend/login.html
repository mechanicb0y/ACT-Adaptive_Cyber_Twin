<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACT — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060a12;
            --panel: rgba(14, 21, 33, .6);
            --panel-solid: #0c121e;
            --panel2: rgba(21, 29, 44, .88);
            --border: rgba(112, 150, 191, .14);
            --border2: rgba(112, 150, 191, .32);
            --text: #e9f1f8;
            --muted: #8497ac;
            --faint: #51637a;
            --accent: #29e0ff;
            --accent2: #8d7bff;
            --crit: #ff4165;
            --low: #38e6a0;
            --font-display: 'Chakra Petch', 'Segoe UI', sans-serif;
            --font-body: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, "Cascadia Mono", Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }

        body {
            color: var(--text);
            font: 13px/1.55 var(--font-body);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(41, 224, 255, .10), transparent 60%),
                radial-gradient(900px 500px at 110% 120%, rgba(141, 123, 255, .10), transparent 55%),
                var(--bg);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px 28px 26px;
            backdrop-filter: blur(10px);
            box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8);
        }

        .brand {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 20px;
            letter-spacing: .14em;
            text-transform: uppercase;
            background: linear-gradient(100deg, var(--text) 35%, var(--accent) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            color: var(--muted);
            font-size: 11.5px;
            margin: 4px 0 22px;
            font-family: var(--font-mono);
        }

        label {
            display: block;
            color: var(--faint);
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 14px 0 6px;
        }

        input[type=text], input[type=password] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            font: 13px var(--font-body);
            padding: 10px 12px;
        }

        input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); outline: none; }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 12px;
        }

        .row input { accent-color: var(--accent); }

        button.primary {
            width: 100%;
            margin-top: 20px;
            padding: 11px 14px;
            border: 0;
            border-radius: 8px;
            font: 600 13px var(--font-display);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #04121a;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            cursor: pointer;
        }

        button.primary:disabled { opacity: .55; cursor: progress; }

        .oauth { margin-top: 18px; display: grid; gap: 8px; }

        .oauth a {
            display: block;
            text-align: center;
            padding: 9px 12px;
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 12px;
            font-family: var(--font-mono);
        }

        .oauth a:hover { border-color: var(--accent); color: var(--accent); }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 4px;
            color: var(--faint);
            font-size: 10px;
            font-family: var(--font-mono);
            letter-spacing: .12em;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .msg {
            margin-top: 14px;
            font-size: 12px;
            font-family: var(--font-mono);
            min-height: 16px;
        }

        .msg.err { color: var(--crit); }
        .msg.ok { color: var(--low); }

        .hint {
            margin-top: 18px;
            color: var(--faint);
            font-size: 10.5px;
            font-family: var(--font-mono);
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <form class="card" id="form" autocomplete="on">
        <div class="brand">ACT</div>
        <div class="sub">adaptive cyber twin — sign in</div>

        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div class="row">
            <input id="remember" type="checkbox">
            <label for="remember" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)">Keep me signed in</label>
        </div>

        <button class="primary" id="submit" type="submit">Sign in</button>

        <div class="oauth" id="oauth" hidden>
            <div class="divider">or</div>
        </div>

        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <div class="hint" id="hint"></div>
    </form>

    <script>
        const API = location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
        const $ = id => document.getElementById(id);
        const msg = (text, kind) => { const m = $("msg"); m.textContent = text || ""; m.className = "msg" + (kind ? " " + kind : ""); };

        /* only ever redirect to a same-origin path — never //host, /\host or absolute URLs */
        function safeNext() {
            const raw = new URLSearchParams(location.search).get("next") || "/";
            try {
                const u = new URL(raw, location.origin);
                if (u.origin === location.origin && u.pathname.startsWith("/")
                    && !u.pathname.startsWith("//")) return u.pathname + u.search;
            } catch (e) { /* fall through */ }
            return "/";
        }

        function store(tok) {
            localStorage.setItem("act_access", tok.access_token);
            localStorage.setItem("act_refresh", tok.refresh_token);
            localStorage.setItem("act_expires", String(Date.now() + (tok.expires_in || 1800) * 1000));
            if (tok.role) localStorage.setItem("act_role", tok.role);
            if (tok.username) localStorage.setItem("act_user", tok.username);
        }

        /* returning from an OAuth round trip: trade the httpOnly hand-off cookie
           for a token pair — nothing sensitive is ever in the URL */
        (async function absorbOAuth() {
            const q = new URLSearchParams(location.search);
            if (q.get("oauth_error")) { msg(decodeURIComponent(q.get("oauth_error")), "err"); }
            if (q.get("oauth") !== "ok") return;
            try {
                const r = await fetch(API + "/api/auth/oauth/complete", { method: "POST" });
                const d = await r.json().catch(() => ({}));
                if (r.ok) { store(d); location.replace("/"); return; }
                msg(d.detail || "OAuth sign-in could not be completed", "err");
            } catch (e) { msg("OAuth sign-in could not be completed", "err"); }
            history.replaceState(null, "", "/login");
        })();

        async function loadProviders() {
            try {
                const r = await fetch(API + "/api/auth/providers");
                if (!r.ok) return;
                const d = await r.json();
                const box = $("oauth");
                let any = false;
                for (const [name, info] of Object.entries(d.oauth || {})) {
                    if (!info.configured) continue;
                    any = true;
                    const a = document.createElement("a");
                    a.href = API + "/api/auth/oauth/" + name + "/login";
                    a.textContent = "Continue with " + name.charAt(0).toUpperCase() + name.slice(1);
                    a.addEventListener("click", () => {
                        a.href = API + "/api/auth/oauth/" + name + "/login?remember_me=" + ($("remember").checked ? "true" : "false");
                    });
                    box.appendChild(a);
                }
                box.hidden = !any;
            } catch (e) { /* offline — local login still works */ }
        }
        loadProviders();

        $("form").addEventListener("submit", async e => {
            e.preventDefault();
            msg("");
            $("submit").disabled = true;
            try {
                const r = await fetch(API + "/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: $("username").value,
                        password: $("password").value,
                        remember_me: $("remember").checked,
                    }),
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { msg(d.detail || ("sign-in failed (" + r.status + ")"), "err"); return; }
                store(d);
                location.replace(safeNext());
            } catch (err) {
                msg("cannot reach the API — is the server running?", "err");
            } finally {
                $("submit").disabled = false;
            }
        });
    </script>
</body>

</html>
