# ACT frontend — serves the static dashboard and proxies the API to the backend.
# Used by frontend/Dockerfile.  ${ACT_BACKEND_URL} is substituted at container
# start (see the Dockerfile entrypoint); it defaults to http://act-backend:8000.
# This file is included inside nginx's http{} block, so the map below is valid.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen        80;
    server_name   _;
    root          /usr/share/nginx/html;
    index         index.html;
    server_tokens off;

    # security headers (HSTS is added by the TLS terminator / Let's Encrypt setup)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;

    # ---- API + generated docs -> backend ---------------------------------
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass              ${ACT_BACKEND_URL};
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        # websocket (/api/stream)
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_read_timeout      3600s;
    }

    # ---- static dashboard ----------------------------------------------------
    location = /login { try_files /login.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
